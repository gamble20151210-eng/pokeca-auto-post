name: Auto Post to X

on:
  schedule:
    - cron: "0 22 * * *"   # 朝7時（日本時間）
    - cron: "0 10 * * *"   # 夜19時（日本時間）
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py
